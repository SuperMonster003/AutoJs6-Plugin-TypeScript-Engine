org.gradle.jvmargs=-Xms256m -Xmx4g -Dkotlin.daemon.jvm.options\="-Xmx2g" -Dfile.encoding\=UTF-8 -XX:+UseParallelGC
org.gradle.daemon=true
org.gradle.parallel=true

android.injected.studio.version.check=false
android.useAndroidX=true
android.nonTransitiveRClass=true
android.nonFinalResIds=true

# Version metadata writes remain opt-in for ordinary verification builds.
autojs.gradle.build.number.auto.increment.enabled=false
autojs.gradle.build.time.update.enabled=false

org.gradle.java.installations.auto-detect=true
org.gradle.java.installations.auto-download=true
